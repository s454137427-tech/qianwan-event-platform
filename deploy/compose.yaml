name: qianwan-events
x-application: &application
  image: qianwan-events:2
  build:
    context: ..
  env_file:
    - .env.production
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: 3000
    DATA_DIR: /app/var
    TRUST_PROXY_HOPS: 1
    WECHAT_VERIFICATION_DIR: /app/wechat-verification
  volumes:
    - ./wechat-verification:/app/wechat-verification:ro
  restart: unless-stopped
  stop_grace_period: 20s
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
    - /app/var:size=32m,uid=1000,gid=1000,mode=0700
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
services:
  app1:
    <<: *application
  app2:
    <<: *application
  gateway:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.container.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
